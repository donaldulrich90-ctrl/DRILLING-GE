<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Debug - Plateforme</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6">
    <div id="status" class="mb-4 p-4 bg-slate-800 rounded">
        <h1 class="text-2xl font-bold mb-2">Test de Diagnostic</h1>
        <p id="statusText" class="text-slate-300">Chargement...</p>
    </div>

    <div id="app" class="bg-slate-800 p-6 rounded">
        <h2 class="text-xl font-bold mb-4">Application</h2>
        <button onclick="testClick()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded">
            Tester le clic
        </button>
        <div id="result" class="mt-4"></div>
    </div>

    <script>
        // Test 1: Vérifier que JavaScript fonctionne
        document.getElementById('statusText').textContent = '✓ JavaScript fonctionne';
        console.log('Script chargé');

        // Test 2: Vérifier Tailwind
        const testDiv = document.createElement('div');
        testDiv.className = 'bg-blue-500 p-2 mt-2 rounded';
        testDiv.textContent = '✓ Tailwind CSS chargé';
        document.getElementById('status').appendChild(testDiv);

        // Test 3: Fonction de clic
        function testClick() {
            document.getElementById('result').innerHTML = 
                '<p class="text-green-400 mt-2">✓ Les clics fonctionnent!</p>';
        }

        // Test 4: Vérifier le chargement complet
        window.addEventListener('load', () => {
            console.log('Page complètement chargée');
            const loadDiv = document.createElement('div');
            loadDiv.className = 'bg-green-500 p-2 mt-2 rounded';
            loadDiv.textContent = '✓ Page complètement chargée';
            document.getElementById('status').appendChild(loadDiv);
        });

        // Test 5: Gestion des erreurs
        window.addEventListener('error', (event) => {
            console.error('ERREUR:', event.error);
            const errorDiv = document.createElement('div');
            errorDiv.className = 'bg-red-500 p-2 mt-2 rounded';
            errorDiv.textContent = '✗ ERREUR: ' + event.error.message;
            document.getElementById('status').appendChild(errorDiv);
        });
    </script>
</body>
</html>
